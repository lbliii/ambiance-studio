format: ambiance-improvement-roadmap
schema_version: 1
updated: '2026-09-12'
status: foundation_integrated_followups_and_observed_pilots_remaining
design: docs/architecture/PRODUCTION-IMPROVEMENTS.md
alignment: docs/architecture/STUDIO-PLAN-ALIGNMENT.md
meaning: Human/agent implementation backlog; not an executable production recipe, scheduler, approval or runtime
  schema.
decisions:
  roadmap_authoring: YAML for task status/dependencies/acceptance; Markdown owns rationale.
  project_contracts: Canonical versioned JSON; optional YAML import only if later justified and normalized through
    the same schema.
  minimum_layers: No universal count. Require identified independently controllable elements, depth relationships
    and actual evidence for the selected scene.
  complexity: A descriptive vector for scope/workload, never an artistic grade.
  quality: Per-view, per-action observed rubric with explicit unknown/revise/meets-direction states; no averaged
    0-100 composition score.
  automation: Reuse the existing CLI/evaluator/revision model. No new background automation or live provider execution
    is created by this plan.
phases:
- id: 0
  name: Consolidate local foundation
- id: 1
  name: Typed expectations, paired framing and CI fixtures
- id: 2
  name: Production preparation and coordinated motion
- id: 3
  name: View evidence, delivery, sound and operational efficiency
- id: 4
  name: Skills integration and observed production pilots
- id: 5
  name: Evidence-triggered follow-up tools
- id: 6
  name: Midnight feedback, creative comparisons and production operation
pilot_expectations:
  project: a-quieter-tomorrow
  status: targets_unreviewed_for_new_revision
  outputs:
  - view: portrait
    width: 1080
    height: 1920
  - view: landscape
    width: 1920
    height: 1080
  required_control_roles:
  - rear-sky
  - cloud-field
  - far-city
  - near-bridge
  - river-reflections
  - fixed-interior-and-window-occlusion
  - independent-ghost-cloth
  - newspaper
  - mouse
  - phone-hand
  - candle-and-floor-response
  viewing_targets:
  - Assess visible environmental life in ordinary five-second spans.
  - Assess an obvious early motion cue around the first two seconds.
  - Judge primary/supporting actions without a pointer or detail crop in each view.
  limits:
  - These are project targets, not universal thresholds or automatic perception scores.
  - Control roles can require multiple art pieces; they are not a fixed renderer-layer quota.
  - Current first-film-v2 remains the exact baseline and does not satisfy the newly planned scope.
