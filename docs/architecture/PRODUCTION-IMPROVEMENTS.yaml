  - Reconcile the separate local encode-checkpoint commit and its integration status.
  - Correct stale implemented/planned capability descriptions; preserve existing project/captured state.
  acceptance:
  - All intended source changes are accounted for and separated from private generated project evidence.
  - Capability entries cite callable commands and implementation evidence; cel-motion milestones 1-3 are not labeled
