- id: DATA-01
  title: Version the production intent, semantic census and expectations contract
  phase: 1
  priority: P0
  status: planned
  relative_size: M
  depends_on:
  - KIT-01
  affected_paths:
  - ambiance_studio/planning.py
  - ambiance_studio/revisions.py
  - templates
  - docs/CONTRACTS.md
  - docs/PRODUCTION-INVENTORY.md
  deliverables:
  - Canonical production-plan JSON with story, source identity, five semantic dimensions, output intentions, expectations
    and realization references.
  - Explicit migration from current census/layer/inventory notes, retaining originals and a reviewable diff.
  - Strict plan inspection/check/application through existing atomic project transaction conventions.
  acceptance:
  - The plan owns creative expectations; inventory owns production stage/evidence; scene owns runtime geometry and
    timing.
  - Logical entities may map to multiple parts; multiple labels on one baked plate cannot claim independent required
    controls.
  - Expectations identify stage, view, rationale/direction source and proof/review kind; scope edits remain visible
    and restorable.
  - Legacy scenes, inventories and sealed records keep their original meaning.
  validation:
  - Schema and migration positive/negative fixtures, including missing/unknown/duplicate fields and IDs.
  - Changed source, out-of-project reference, stale write, round-trip and restore checks.
  - Recorded unplanned/unreviewed states never become vacuous passes.
  source_specs:
  - docs/SEED-TO-STAGE.md
  - docs/MOTION-DIRECTION.md
  - docs/LAYER-AND-LIGHT-PLANNING.md
